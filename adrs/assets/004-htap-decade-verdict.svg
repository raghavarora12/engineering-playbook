<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Timeline: in October 2024 Snowflake's Unistore hybrid tables reach general availability in AWS regions, the industry's most ambitious single-engine HTAP bet yet. It launches far short of OLTP-grade: default quotas of roughly 1,000 operations per second and 500 gigabytes of active data, both raisable on request, and no materialized views, cloning, streams, or replication. In May 2025 Databricks acquires Neon, a dedicated Postgres provider. In June 2025 Snowflake acquires Crunchy Data, another dedicated Postgres provider. Verdict: compose two engines, don't converge into one. Footnote: Snowflake has since raised the quotas to roughly 16,000 operations per second and 2 terabytes per database; the starting position is the point, not the number.">
<defs>
<linearGradient id="hdBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0d12"/><stop offset="0.5" stop-color="#080b14"/><stop offset="1" stop-color="#070c17"/></linearGradient>
<filter id="hdGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="hdGlowSoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>

<linearGradient id="hdRail" x1="220" y1="250" x2="1360" y2="250" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#f4faff"/>
  <stop offset="0.33" stop-color="#ff5c4d"/>
  <stop offset="0.66" stop-color="#ffa53d"/>
  <stop offset="1" stop-color="#ffa53d"/>
</linearGradient>

<radialGradient id="hdDotTop" cx="800" cy="170" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff" stop-opacity="0.6"/><stop offset="1" stop-color="#f4faff" stop-opacity="0"/></radialGradient>
</defs>

<rect x="0" y="0" width="1600" height="900" fill="url(#hdBg)"/>

<!-- top intro card -->
<rect x="380" y="50" width="840" height="120" rx="22" fill="#f4faff" fill-opacity="0.14" filter="url(#hdGlowSoft)"/>
<rect x="380" y="50" width="840" height="120" rx="22" fill="#0d1420" fill-opacity="0.85" stroke="#f4faff" stroke-opacity="0.55" stroke-width="1.6"/>
<text x="800" y="82" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#a9b4c9" opacity="0.9">OCTOBER 2024 · SNOWFLAKE UNISTORE HYBRID TABLES REACH GA (AWS)</text>
<text x="800" y="114" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#f4faff">The industry's most ambitious single-engine</text>
<text x="800" y="142" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#f4faff">HTAP bet yet.</text>

<!-- connector: top card to rail -->
<line x1="800" y1="170" x2="800" y2="250" stroke="#f4faff" stroke-width="3" opacity="0.6" filter="url(#hdGlow)"/>
<circle cx="800" cy="170" r="20" fill="url(#hdDotTop)"/><circle cx="800" cy="170" r="7" fill="#f4faff"/>

<!-- timeline rail -->
<g style="mix-blend-mode:screen">
  <line x1="220" y1="250" x2="1360" y2="250" stroke="url(#hdRail)" stroke-width="8" stroke-linecap="round" opacity="0.5" filter="url(#hdGlow)"/>
  <line x1="220" y1="250" x2="1360" y2="250" stroke="url(#hdRail)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</g>
<circle cx="220" cy="250" r="9" fill="#f4faff"/>
<circle cx="600" cy="250" r="9" fill="#ff5c4d"/>
<circle cx="980" cy="250" r="9" fill="#ffa53d"/>
<circle cx="1360" cy="250" r="9" fill="#ffa53d"/>

<!-- connectors: rail to cards -->
<line x1="220" y1="250" x2="220" y2="300" stroke="#f4faff" stroke-width="2.5" opacity="0.55"/>
<line x1="600" y1="250" x2="600" y2="300" stroke="#ff5c4d" stroke-width="2.5" opacity="0.55"/>
<line x1="980" y1="250" x2="980" y2="300" stroke="#ffa53d" stroke-width="2.5" opacity="0.55"/>
<line x1="1360" y1="250" x2="1360" y2="300" stroke="#ffa53d" stroke-width="2.5" opacity="0.55"/>

<!-- card 1: GA -->
<rect x="70" y="300" width="300" height="210" rx="20" fill="#f4faff" fill-opacity="0.10" filter="url(#hdGlowSoft)"/>
<rect x="70" y="300" width="300" height="210" rx="20" fill="#0d1420" fill-opacity="0.85" stroke="#f4faff" stroke-opacity="0.5" stroke-width="1.6"/>
<text x="220" y="336" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#c7cfe0">GENERAL AVAILABILITY</text>
<text x="220" y="376" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">Unistore hybrid tables</text>
<text x="220" y="402" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">ship inside Snowflake.</text>
<text x="220" y="440" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c7cfe0" opacity="0.85">One engine, row + columnar,</text>
<text x="220" y="462" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c7cfe0" opacity="0.85">txn + analytics together.</text>

<!-- card 2: limits -->
<rect x="450" y="300" width="300" height="210" rx="20" fill="#ff5c4d" fill-opacity="0.14" filter="url(#hdGlowSoft)"/>
<rect x="450" y="300" width="300" height="210" rx="20" fill="#1c0f0c" fill-opacity="0.85" stroke="#ff5c4d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="600" y="336" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ff5c4d">DEFAULT QUOTAS AT LAUNCH</text>
<text x="600" y="372" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#e7ecf7">~1,000 ops/sec,</text>
<text x="600" y="396" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#e7ecf7">500 GB active data.</text>
<text x="600" y="420" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ffb4a8" opacity="0.75">Both raisable on request.</text>
<text x="600" y="452" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ffb4a8" opacity="0.9">No materialized views, cloning,</text>
<text x="600" y="474" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#ffb4a8" opacity="0.9">streams, or replication.</text>

<!-- card 3: Databricks acquires Neon -->
<rect x="830" y="300" width="300" height="210" rx="20" fill="#ffa53d" fill-opacity="0.14" filter="url(#hdGlowSoft)"/>
<rect x="830" y="300" width="300" height="210" rx="20" fill="#1c150c" fill-opacity="0.85" stroke="#ffa53d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="980" y="336" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffa53d">MAY 2025</text>
<text x="980" y="372" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">Databricks acquires</text>
<text x="980" y="398" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">Neon — a dedicated</text>
<text x="980" y="424" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">Postgres provider.</text>

<!-- card 4: Snowflake acquires Crunchy Data -->
<rect x="1210" y="300" width="300" height="210" rx="20" fill="#ffa53d" fill-opacity="0.14" filter="url(#hdGlowSoft)"/>
<rect x="1210" y="300" width="300" height="210" rx="20" fill="#1c150c" fill-opacity="0.85" stroke="#ffa53d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="1360" y="336" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffa53d">JUNE 2025</text>
<text x="1360" y="372" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">Snowflake acquires</text>
<text x="1360" y="398" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">Crunchy Data — another</text>
<text x="1360" y="424" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#e7ecf7">dedicated Postgres provider.</text>

<!-- connectors: cards to verdict banner -->
<line x1="220" y1="510" x2="220" y2="650" stroke="#f4faff" stroke-width="2.5" opacity="0.4"/>
<line x1="600" y1="510" x2="600" y2="650" stroke="#ff5c4d" stroke-width="2.5" opacity="0.4"/>
<line x1="980" y1="510" x2="980" y2="650" stroke="#ffa53d" stroke-width="2.5" opacity="0.4"/>
<line x1="1360" y1="510" x2="1360" y2="650" stroke="#ffa53d" stroke-width="2.5" opacity="0.4"/>

<!-- verdict banner -->
<rect x="150" y="650" width="1300" height="110" rx="30" fill="#2dd4bf" fill-opacity="0.14" filter="url(#hdGlowSoft)"/>
<rect x="150" y="650" width="1300" height="110" rx="30" fill="#0d1a1c" fill-opacity="0.9" stroke="#2dd4bf" stroke-width="2"/>
<text x="800" y="695" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#2dd4bf">VERDICT</text>
<text x="800" y="730" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#9ff3e6">Compose two engines — don't converge into one</text>

<text x="800" y="828" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#c7cfe0" opacity="0.85">BOTH BOUGHT A DEDICATED POSTGRES ENGINE RATHER THAN EXTEND THEIR ANALYTICAL ONE</text>
<text x="800" y="862" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="0.5" fill="#a9b4c9" opacity="0.6">Snowflake has since raised the quotas to ~16,000 ops/sec and 2 TB per database — the starting position is the point, not the number.</text>
</svg>
