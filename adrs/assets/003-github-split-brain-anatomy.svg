<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Diagram: on 21 October 2018 a 43-second connectivity loss between GitHub's US East Coast network hub and primary datacentre caused Orchestrator to lose quorum. The West Coast and East Coast public-cloud nodes formed a new quorum and failed over writes westward. When connectivity returned, both coasts held writes the other did not have, so rolling back either side meant losing real user data. GitHub chose to fail forward instead. The outcome: a 43-second trigger, 24 hours and 11 minutes to fully restore service, and a forced fail-forward decision. Caption: what active-active actually costs is a consistency problem on your worst day.">
<defs>
<linearGradient id="gsBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0d12"/><stop offset="0.5" stop-color="#080b14"/><stop offset="1" stop-color="#070c17"/></linearGradient>
<filter id="gsGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="gsGlowSoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>

<linearGradient id="gsL1" x1="800" y1="185" x2="550" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff"/><stop offset="1" stop-color="#ff5c4d"/></linearGradient>
<linearGradient id="gsL1b" x1="800" y1="185" x2="550" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffb4a8"/></linearGradient>
<linearGradient id="gsL2" x1="800" y1="185" x2="1050" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff"/><stop offset="1" stop-color="#ffa53d"/></linearGradient>
<linearGradient id="gsL2b" x1="800" y1="185" x2="1050" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>

<linearGradient id="gsL3" x1="550" y1="540" x2="800" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5c4d"/><stop offset="1" stop-color="#c7cfe0"/></linearGradient>
<linearGradient id="gsL4" x1="1050" y1="540" x2="800" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffa53d"/><stop offset="1" stop-color="#c7cfe0"/></linearGradient>

<linearGradient id="gsL5" x1="800" y1="640" x2="280" y2="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c7cfe0"/><stop offset="1" stop-color="#ff5c4d"/></linearGradient>
<linearGradient id="gsL6" x1="800" y1="640" x2="800" y2="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c7cfe0"/><stop offset="1" stop-color="#ffa53d"/></linearGradient>
<linearGradient id="gsL7" x1="800" y1="640" x2="1320" y2="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c7cfe0"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>

<radialGradient id="gsDotTop" cx="800" cy="185" r="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff" stop-opacity="0.6"/><stop offset="1" stop-color="#f4faff" stop-opacity="0"/></radialGradient>
<radialGradient id="gsDotMerge" cx="800" cy="640" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c7cfe0" stop-opacity="0.55"/><stop offset="1" stop-color="#c7cfe0" stop-opacity="0"/></radialGradient>
</defs>

<rect x="0" y="0" width="1600" height="900" fill="url(#gsBg)"/>

<!-- top incident card -->
<rect x="400" y="55" width="800" height="130" rx="22" fill="#f4faff" fill-opacity="0.14" filter="url(#gsGlowSoft)"/>
<rect x="400" y="55" width="800" height="130" rx="22" fill="#0d1420" fill-opacity="0.85" stroke="#f4faff" stroke-opacity="0.55" stroke-width="1.6"/>
<text x="800" y="88" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#a9b4c9" opacity="0.9">21 OCTOBER 2018 · GITHUB, US EAST COAST NETWORK HUB</text>
<text x="800" y="122" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4faff">A 43-second connectivity loss triggers automatic</text>
<text x="800" y="152" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4faff">failover — working exactly as configured.</text>

<!-- connectors: top card to branch cards -->
<g style="mix-blend-mode:screen">
  <path d="M800,185 C675,185 675,330 550,330" fill="none" stroke="url(#gsL1)" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#gsGlow)"/>
  <path d="M800,185 C675,185 675,330 550,330" fill="none" stroke="url(#gsL1b)" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M800,185 C925,185 925,330 1050,330" fill="none" stroke="url(#gsL2)" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#gsGlow)"/>
  <path d="M800,185 C925,185 925,330 1050,330" fill="none" stroke="url(#gsL2b)" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>
<circle cx="800" cy="185" r="24" fill="url(#gsDotTop)"/><circle cx="800" cy="185" r="8" fill="#f4faff"/>

<!-- left branch: orchestrator loses quorum -->
<rect x="290" y="330" width="520" height="210" rx="22" fill="#ff5c4d" fill-opacity="0.14" filter="url(#gsGlowSoft)"/>
<rect x="290" y="330" width="520" height="210" rx="22" fill="#1c0f0c" fill-opacity="0.85" stroke="#ff5c4d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="550" y="368" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#ff5c4d">ORCHESTRATOR</text>
<text x="550" y="408" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e7ecf7">Loses quorum on the East Coast —</text>
<text x="550" y="436" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e7ecf7">West Coast nodes elect a new primary.</text>
<text x="550" y="475" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#ffb4a8" opacity="0.9">Writes start landing on both</text>
<text x="550" y="497" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#ffb4a8" opacity="0.9">coasts at once.</text>

<!-- right branch: reconciliation -->
<rect x="810" y="330" width="520" height="210" rx="22" fill="#ffa53d" fill-opacity="0.14" filter="url(#gsGlowSoft)"/>
<rect x="810" y="330" width="520" height="210" rx="22" fill="#1c150c" fill-opacity="0.85" stroke="#ffa53d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="1070" y="368" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#ffa53d">RECONCILIATION</text>
<text x="1070" y="408" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e7ecf7">Connectivity returns; both coasts</text>
<text x="1070" y="436" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e7ecf7">hold writes the other lacks.</text>
<text x="1070" y="475" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#ffd9a0" opacity="0.9">Rolling back either side means</text>
<text x="1070" y="497" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#ffd9a0" opacity="0.9">losing real user data.</text>

<!-- connectors: branch cards to merge point -->
<g style="mix-blend-mode:screen">
  <path d="M550,540 C675,540 675,640 800,640" fill="none" stroke="url(#gsL3)" stroke-width="8" stroke-linecap="round" opacity="0.45" filter="url(#gsGlow)"/>
  <path d="M550,540 C675,540 675,640 800,640" fill="none" stroke="#ffb4a8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M1050,540 C925,540 925,640 800,640" fill="none" stroke="url(#gsL4)" stroke-width="8" stroke-linecap="round" opacity="0.45" filter="url(#gsGlow)"/>
  <path d="M1050,540 C925,540 925,640 800,640" fill="none" stroke="#ffd9a0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</g>
<circle cx="800" cy="640" r="20" fill="url(#gsDotMerge)"/><circle cx="800" cy="640" r="6.5" fill="#e7ecf7"/>

<!-- connectors: merge point to outcome pills -->
<g style="mix-blend-mode:screen">
  <path d="M800,640 C540,640 540,700 280,700" fill="none" stroke="url(#gsL5)" stroke-width="8" stroke-linecap="round" opacity="0.45" filter="url(#gsGlow)"/>
  <path d="M800,640 C540,640 540,700 280,700" fill="none" stroke="#ffb4a8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M800,640 L800,700" fill="none" stroke="url(#gsL6)" stroke-width="8" stroke-linecap="round" opacity="0.45" filter="url(#gsGlow)"/>
  <path d="M800,640 L800,700" fill="none" stroke="#ffd9a0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M800,640 C1060,640 1060,700 1320,700" fill="none" stroke="url(#gsL7)" stroke-width="8" stroke-linecap="round" opacity="0.45" filter="url(#gsGlow)"/>
  <path d="M800,640 C1060,640 1060,700 1320,700" fill="none" stroke="#b9d0ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</g>

<!-- outcome pills -->
<rect x="130" y="700" width="300" height="86" rx="43" fill="#ff5c4d" fill-opacity="0.16" filter="url(#gsGlowSoft)"/>
<rect x="130" y="700" width="300" height="86" rx="43" fill="#1c0f0c" fill-opacity="0.9" stroke="#ff5c4d" stroke-width="2"/>
<text x="280" y="753" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffb4a8">43s to break it</text>

<rect x="650" y="700" width="300" height="86" rx="43" fill="#ffa53d" fill-opacity="0.16" filter="url(#gsGlowSoft)"/>
<rect x="650" y="700" width="300" height="86" rx="43" fill="#1c150c" fill-opacity="0.9" stroke="#ffa53d" stroke-width="2"/>
<text x="800" y="753" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffd9a0">24h 11m to fix it</text>

<rect x="1170" y="700" width="300" height="86" rx="43" fill="#4c8dff" fill-opacity="0.16" filter="url(#gsGlowSoft)"/>
<rect x="1170" y="700" width="300" height="86" rx="43" fill="#0d1420" fill-opacity="0.9" stroke="#4c8dff" stroke-width="2"/>
<text x="1320" y="746" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#b9d0ff">Forced to fail</text>
<text x="1320" y="770" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#b9d0ff">forward</text>

<text x="800" y="852" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.5" fill="#c7cfe0" opacity="0.85">WHAT ACTIVE-ACTIVE ACTUALLY COSTS: A CONSISTENCY PROBLEM ON YOUR WORST DAY</text>
</svg>
