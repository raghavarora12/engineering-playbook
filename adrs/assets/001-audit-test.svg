<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Diagram: an auditor asks what settled_amount means and asks for proof. The canonical path gives one governed definition and one lineage graph, which is answerable. The hybrid middleware path has four consumers with four definitions and four lineages to reconcile, which is messy. The transform-on-read path has the same four-way fragmentation and is un-provable.">
<defs>
<linearGradient id="atBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#100d10"/><stop offset="0.5" stop-color="#080b14"/><stop offset="1" stop-color="#070c17"/></linearGradient>
<filter id="atGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="atGlowSoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>

<linearGradient id="atLine1" x1="800" y1="165" x2="280" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
<linearGradient id="atLine1b" x1="800" y1="165" x2="280" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ff3e6"/></linearGradient>
<linearGradient id="atLine2" x1="800" y1="165" x2="800" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff"/><stop offset="1" stop-color="#ffa53d"/></linearGradient>
<linearGradient id="atLine2b" x1="800" y1="165" x2="800" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
<linearGradient id="atLine3" x1="800" y1="165" x2="1320" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff"/><stop offset="1" stop-color="#ff5c4d"/></linearGradient>
<linearGradient id="atLine3b" x1="800" y1="165" x2="1320" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffb4a8"/></linearGradient>

<radialGradient id="atDotQ" cx="800" cy="165" r="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4faff" stop-opacity="0.6"/><stop offset="1" stop-color="#f4faff" stop-opacity="0"/></radialGradient>
<radialGradient id="atDotCA" cx="280" cy="330" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.6"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="atDotHA" cx="800" cy="330" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffa53d" stop-opacity="0.6"/><stop offset="1" stop-color="#ffa53d" stop-opacity="0"/></radialGradient>
<radialGradient id="atDotTA" cx="1320" cy="330" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5c4d" stop-opacity="0.6"/><stop offset="1" stop-color="#ff5c4d" stop-opacity="0"/></radialGradient>
</defs>

<rect x="0" y="0" width="1600" height="900" fill="url(#atBg)"/>

<!-- connectors: Q to the three branch cards -->
<g style="mix-blend-mode:screen">
  <path d="M800,165 C800,255 280,240 280,330" fill="none" stroke="url(#atLine1)" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#atGlow)"/>
  <path d="M800,165 C800,255 280,240 280,330" fill="none" stroke="url(#atLine1b)" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M800,165 C800,235 800,260 800,330" fill="none" stroke="url(#atLine2)" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#atGlow)"/>
  <path d="M800,165 C800,235 800,260 800,330" fill="none" stroke="url(#atLine2b)" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M800,165 C800,255 1320,240 1320,330" fill="none" stroke="url(#atLine3)" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#atGlow)"/>
  <path d="M800,165 C800,255 1320,240 1320,330" fill="none" stroke="url(#atLine3b)" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>

<!-- connectors: branch cards down to outcome pills -->
<g style="mix-blend-mode:screen">
  <path d="M280,510 L280,700" fill="none" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" opacity="0.45" filter="url(#atGlow)"/>
  <path d="M280,510 L280,700" fill="none" stroke="#9ff3e6" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M800,510 L800,700" fill="none" stroke="#ffa53d" stroke-width="9" stroke-linecap="round" opacity="0.45" filter="url(#atGlow)"/>
  <path d="M800,510 L800,700" fill="none" stroke="#ffd9a0" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>
<g style="mix-blend-mode:screen">
  <path d="M1320,510 L1320,700" fill="none" stroke="#ff5c4d" stroke-width="9" stroke-linecap="round" opacity="0.45" filter="url(#atGlow)"/>
  <path d="M1320,510 L1320,700" fill="none" stroke="#ffb4a8" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
</g>

<!-- junction dots -->
<circle cx="800" cy="165" r="24" fill="url(#atDotQ)"/><circle cx="800" cy="165" r="8" fill="#f4faff"/>
<circle cx="280" cy="330" r="20" fill="url(#atDotCA)"/><circle cx="280" cy="330" r="6.5" fill="#9ff3e6"/>
<circle cx="800" cy="330" r="20" fill="url(#atDotHA)"/><circle cx="800" cy="330" r="6.5" fill="#ffd9a0"/>
<circle cx="1320" cy="330" r="20" fill="url(#atDotTA)"/><circle cx="1320" cy="330" r="6.5" fill="#ffb4a8"/>

<!-- Q card (auditor question) -->
<rect x="540" y="55" width="520" height="110" rx="22" fill="#f4faff" fill-opacity="0.15" filter="url(#atGlowSoft)"/>
<rect x="540" y="55" width="520" height="110" rx="22" fill="#0d1420" fill-opacity="0.85" stroke="#f4faff" stroke-opacity="0.55" stroke-width="1.6"/>
<text x="800" y="85" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#a9b4c9" opacity="0.9">AUDITOR ASKS</text>
<text x="800" y="115" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" fill="#f4faff">What does "settled_amount" mean —</text>
<text x="800" y="145" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" fill="#f4faff">and prove it?</text>

<!-- Canonical branch card -->
<rect x="60" y="330" width="440" height="180" rx="22" fill="#2dd4bf" fill-opacity="0.14" filter="url(#atGlowSoft)"/>
<rect x="60" y="330" width="440" height="180" rx="22" fill="#0d1a1c" fill-opacity="0.85" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="280" y="368" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#2dd4bf">CANONICAL</text>
<text x="280" y="410" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7ecf7">One governed definition,</text>
<text x="280" y="438" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7ecf7">one lineage graph.</text>
<text x="280" y="480" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#9ff3e6" opacity="0.9">Reconciled once, at the boundary.</text>

<!-- Hybrid branch card -->
<rect x="580" y="330" width="440" height="180" rx="22" fill="#ffa53d" fill-opacity="0.14" filter="url(#atGlowSoft)"/>
<rect x="580" y="330" width="440" height="180" rx="22" fill="#1c150c" fill-opacity="0.85" stroke="#ffa53d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="800" y="368" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#ffa53d">HYBRID (MIDDLEWARE)</text>
<text x="800" y="410" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7ecf7">4 consumers, 4 definitions,</text>
<text x="800" y="438" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7ecf7">4 lineages to reconcile.</text>
<text x="800" y="480" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffd9a0" opacity="0.9">Raw is transformed downstream of landing.</text>

<!-- Transform-on-read branch card -->
<rect x="1100" y="330" width="440" height="180" rx="22" fill="#ff5c4d" fill-opacity="0.14" filter="url(#atGlowSoft)"/>
<rect x="1100" y="330" width="440" height="180" rx="22" fill="#1c0f0c" fill-opacity="0.85" stroke="#ff5c4d" stroke-opacity="0.7" stroke-width="1.8"/>
<text x="1320" y="368" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#ff5c4d">TRANSFORM-ON-READ</text>
<text x="1320" y="410" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7ecf7">4 consumers, 4 definitions,</text>
<text x="1320" y="438" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7ecf7">4 lineages to reconcile.</text>
<text x="1320" y="480" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ffb4a8" opacity="0.9">Every consumer interprets raw independently.</text>

<!-- outcome pills -->
<rect x="130" y="700" width="300" height="86" rx="43" fill="#2dd4bf" fill-opacity="0.16" filter="url(#atGlowSoft)"/>
<rect x="130" y="700" width="300" height="86" rx="43" fill="#0d1a1c" fill-opacity="0.9" stroke="#2dd4bf" stroke-width="2"/>
<text x="280" y="753" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#9ff3e6">✓ Answerable</text>

<rect x="650" y="700" width="300" height="86" rx="43" fill="#ffa53d" fill-opacity="0.16" filter="url(#atGlowSoft)"/>
<rect x="650" y="700" width="300" height="86" rx="43" fill="#1c150c" fill-opacity="0.9" stroke="#ffa53d" stroke-width="2"/>
<text x="800" y="753" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd9a0">⚠ Messy</text>

<rect x="1170" y="700" width="300" height="86" rx="43" fill="#ff5c4d" fill-opacity="0.16" filter="url(#atGlowSoft)"/>
<rect x="1170" y="700" width="300" height="86" rx="43" fill="#1c0f0c" fill-opacity="0.9" stroke="#ff5c4d" stroke-width="2"/>
<text x="1320" y="753" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffb4a8">✕ Un-provable</text>

<text x="800" y="852" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.5" fill="#c7cfe0" opacity="0.85">THE AUDIT TEST — ONE PROVABLE ANSWER, OR N RECONCILIATIONS TO RE-DERIVE ONE</text>
</svg>
