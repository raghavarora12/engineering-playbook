<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Chart: the four disaster-recovery strategies, from backup and restore through pilot light and warm standby to multi-site active-active, plotted on a single rising curve of steady-state cost. Backup and restore is cheapest with a recovery time of hours; pilot light and warm standby step up in cost as recovery time drops to minutes and seconds; multi-site active-active is the most expensive, with near-zero recovery time, and its cost is paid every day, not only during a disaster.">
<defs>
<linearGradient id="drBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0d12"/><stop offset="0.5" stop-color="#080b14"/><stop offset="1" stop-color="#070c17"/></linearGradient>
<filter id="drGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>

<linearGradient id="drCurveGlow" x1="280" y1="690" x2="1480" y2="180" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.6" stop-color="#ffa53d"/><stop offset="1" stop-color="#ff5c4d"/></linearGradient>
<linearGradient id="drCurveLine" x1="280" y1="690" x2="1480" y2="180" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9ff3e6"/><stop offset="0.6" stop-color="#ffd9a0"/><stop offset="1" stop-color="#ffb4a8"/></linearGradient>

<radialGradient id="drDotEnd" cx="1480" cy="180" r="18" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5c4d" stop-opacity="0.6"/><stop offset="1" stop-color="#ff5c4d" stop-opacity="0"/></radialGradient>
<radialGradient id="drDot1" cx="280" cy="690" r="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="drDot2" cx="680" cy="570" r="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9ff3e6" stop-opacity="0.55"/><stop offset="1" stop-color="#9ff3e6" stop-opacity="0"/></radialGradient>
<radialGradient id="drDot3" cx="1080" cy="390" r="14" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffa53d" stop-opacity="0.55"/><stop offset="1" stop-color="#ffa53d" stop-opacity="0"/></radialGradient>
</defs>

<rect x="0" y="0" width="1600" height="900" fill="url(#drBg)"/>

<text x="800" y="66" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#f4faff">The DR spectrum: cost climbs steeply as RTO shrinks toward zero</text>
<text x="800" y="96" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1" fill="#a9b4c9" opacity="0.85">STEADY-STATE COST, ILLUSTRATIVE — SHAPE OF THE TRADEOFF, NOT A LINEAR $ SCALE</text>

<!-- axis -->
<line x1="200" y1="750" x2="1500" y2="750" stroke="#3a4258" stroke-width="2"/>
<line x1="200" y1="150" x2="200" y2="750" stroke="#3a4258" stroke-width="2"/>
<text x="150" y="450" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2" fill="#a9b4c9" opacity="0.75" transform="rotate(-90 150 450)">STEADY-STATE COST</text>

<!-- curve -->
<g style="mix-blend-mode:screen">
  <path d="M280,690 C480,690 480,570 680,570 C880,570 880,390 1080,390 C1280,390 1280,180 1480,180" fill="none" stroke="url(#drCurveGlow)" stroke-width="9" stroke-linecap="round" opacity="0.5" filter="url(#drGlow)"/>
  <path d="M280,690 C480,690 480,570 680,570 C880,570 880,390 1080,390 C1280,390 1280,180 1480,180" fill="none" stroke="url(#drCurveLine)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
</g>

<!-- points -->
<circle cx="280" cy="690" r="14" fill="url(#drDot1)"/><circle cx="280" cy="690" r="7" fill="#9ff3e6"/>
<circle cx="680" cy="570" r="14" fill="url(#drDot2)"/><circle cx="680" cy="570" r="7" fill="#c8f5ee"/>
<circle cx="1080" cy="390" r="14" fill="url(#drDot3)"/><circle cx="1080" cy="390" r="7" fill="#ffd9a0"/>
<circle cx="1480" cy="180" r="18" fill="url(#drDotEnd)"/><circle cx="1480" cy="180" r="7" fill="#ffb4a8"/>

<!-- point 1: backup & restore -->
<text x="280" y="784" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#e7ecf7">Backup &amp; restore</text>
<text x="280" y="806" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" fill="#9ff3e6" opacity="0.9">RTO: hours</text>

<!-- point 2: pilot light -->
<text x="680" y="784" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#e7ecf7">Pilot light</text>
<text x="680" y="806" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" fill="#c8f5ee" opacity="0.9">RTO: 10s of min–hours</text>

<!-- point 3: warm standby -->
<text x="1080" y="784" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#e7ecf7">Warm standby</text>
<text x="1080" y="806" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" fill="#ffd9a0" opacity="0.9">RTO: minutes</text>

<!-- point 4: active-active -->
<rect x="1330" y="205" width="290" height="66" rx="14" fill="#1c0f0c" fill-opacity="0.9" stroke="#ff5c4d" stroke-opacity="0.6" stroke-width="1.6"/>
<text x="1475" y="230" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffb4a8">Multi-site active-active</text>
<text x="1475" y="253" text-anchor="middle" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" fill="#ffb4a8" opacity="0.9">RTO: seconds — paid every day</text>
<text x="1480" y="806" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#e7ecf7"> </text>

<text x="1480" y="864" text-anchor="end" font-family="ui-monospace, Cascadia Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffb4a8" opacity="0.85">NEAR-ZERO RTO IS A STANDING TAX, NOT A ONE-TIME PURCHASE</text>
</svg>
